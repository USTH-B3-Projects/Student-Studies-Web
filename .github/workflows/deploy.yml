name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build deployable site
        run: |
          mkdir -p _site

          # Keep deployed page URLs at the site root; source HTML lives in FE/pages.
          cp FE/pages/*.html _site/
          cp -r FE/pages/ui _site/ui
          cp FE/*.js _site/
          for directory in components services utils css assets; do
            cp -r "FE/$directory" "_site/$directory"
          done
          mkdir -p _site/pages
          cp FE/pages/*.js _site/pages/
          find _site -name '*.test.mjs' -delete

          # HTML and injected image paths resolve against the deployed page URL.
          find _site -maxdepth 1 -name '*.html' -exec sed -i 's|\.\./css/|./css/|g; s|\.\./assets/|./assets/|g; s|\.\./app\.js|./app.js|g' {} +
          find _site -name '*.js' -exec sed -i 's|\.\./assets/|./assets/|g' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
