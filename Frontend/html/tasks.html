<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>All Tasks - StudentStudies</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem("studyflow_theme")||"light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/ui/light_dark.css" />
    <link rel="stylesheet" href="../css/dashboard.css?v=2" />
    <link rel="stylesheet" href="../css/course.css" />
  </head>
  <body data-page="tasks">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="dashboard.html"><img class="brand-logo" src="../source/logo.png" alt="StudentStudies" /></a>
        <nav class="nav nav-links"><a href="dashboard.html">Dashboard</a><a href="course.html">Courses</a><a class="active" href="tasks.html">Tasks</a><a href="calendar.html">Calendar</a></nav>
        <div class="nav-actions user-actions">
          <label class="ui-switch" title="Switch to dark mode">
  <input id="themeToggle" type="checkbox" aria-label="Switch to dark mode">
  <div class="slider">
    <div class="circle"></div>
  </div>
</label>
          <span id="userAvatar" class="user-avatar" aria-hidden="true"></span><span id="userName" class="user-name"></span><button id="logoutBtn" class="btn btn-outline" type="button">Log out</button>
        </div>
      </div>
    </header>
    <main class="container course-main all-tasks-main page-enter">
      <section class="all-tasks-head"><div><h1>All Tasks</h1><p>Everything you need to finish, organized by time.</p></div><button id="addTaskBtn" class="btn btn-primary" type="button">+ Add task</button></section>
      <section class="task-toolbar"><div id="filters" class="filters"></div><div class="toolbar-actions"><input id="taskSearch" class="input" type="search" placeholder="Search tasks..."><div id="courseAutocomplete" class="course-autocomplete"><input id="courseFilter" class="select" type="search" placeholder="Search courses..." aria-label="Filter by course" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="courseOptions" autocomplete="off"><div id="courseOptions" class="course-options" role="listbox"></div></div><select id="sortSelect" class="select"><option value="priority">Sort: Priority</option><option value="deadline">Sort: Deadline</option><option value="importance">Sort: Importance</option></select></div></section>
      <section id="bulkActions" class="bulk-actions" aria-live="polite" hidden></section>
      <section id="taskList" class="task-list"></section>
    </main>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js?v=6"></script>
  </body>
</html>
