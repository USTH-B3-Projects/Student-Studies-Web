<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calendar - StudentStudies</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem("studyflow_theme")||"light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/ui/light_dark.css" />
    <link rel="stylesheet" href="../css/dashboard.css?v=2" />
    <link rel="stylesheet" href="../css/calendar.css?v=8" />
  </head>
  <body data-page="calendar">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="dashboard.html"><img class="brand-logo" src="../source/logo.png" alt="StudentStudies" /></a>
        <nav class="nav nav-links"><a href="dashboard.html">Dashboard</a><a href="course.html">Courses</a><a href="tasks.html">Tasks</a><a class="active" href="calendar.html">Calendar</a></nav>
        <div class="nav-actions user-actions">
          <label class="ui-switch" title="Switch to dark mode"><input id="themeToggle" type="checkbox" aria-label="Switch to dark mode"><div class="slider"><div class="circle"></div></div></label>
          <span id="userAvatar" class="user-avatar" aria-hidden="true"></span><span id="userName" class="user-name"></span><button id="logoutBtn" class="btn btn-outline" type="button">Log out</button>
        </div>
      </div>
    </header>
    <main class="calendar-page container page-enter">
      <aside class="calendar-sidebar card">
        <header><h1>Tasks</h1><a class="btn btn-primary" href="tasks.html">+ Add task</a></header>
        <input id="calendarTaskSearch" class="input" type="search" placeholder="Search tasks..." aria-label="Search tasks" />
        <div id="calendarFilters" class="calendar-filters" aria-label="Task filters"></div>
        <div id="calendarTaskList" class="calendar-task-list" aria-live="polite"></div>
      </aside>
      <section class="calendar-panel card">
        <header class="calendar-toolbar">
          <div class="calendar-nav"><button id="calendarToday" class="btn btn-outline" type="button">Today</button><button id="calendarPrev" class="icon-btn" type="button" aria-label="Previous week">‹</button><h2 id="calendarWeekLabel"></h2><button id="calendarNext" class="icon-btn" type="button" aria-label="Next week">›</button></div>
          <div class="calendar-views" aria-label="Calendar view"><button type="button" data-calendar-view="day">Day</button><button class="active" type="button" data-calendar-view="week" aria-current="true">Week</button><button type="button" data-calendar-view="month">Month</button></div>
        </header>
        <div class="calendar-scroll"><div id="weeklyCalendar" class="weekly-calendar"></div></div>
      </section>
    </main>
    <div id="calendarModalRoot"></div><div id="modalRoot"></div>
    <script type="module" src="../js/app.js?v=5"></script>
    <script type="module" src="../js/calendar.js?v=8"></script>
  </body>
</html>
